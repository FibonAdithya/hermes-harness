# ~/nights/config.toml — the only input the night timers read.
# Edited over SSH by the owner; no verb writes it except to pop the Talos queue.

[fleet]
repo = "fleet-fixture"
hours = 8

[talos]
iterations = 18
backend = "local"   # local or modal; c3 is refused here, it starts only from an approved run_talos
# compute_usd = 5     # passed as --budget-compute-usd; at most 90

[[talos.queue]]
challenge = "knapsack"
direction = "try a randomized greedy warm start before local search"
