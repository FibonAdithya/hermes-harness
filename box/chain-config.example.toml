# chaind config for the box. install.sh copies this to ~/.config/chain/config.toml if absent.
# No [intake] table: fleet submits tasks; chain does not poll for them.
#
# chain falls back to built-in stage budgets (summing to well over 40 USD) for any
# stage not set here, and review/fix repeat, so all seven stages are set.
# Worst-case run ceiling:
#   confirm + plan + audit + implement + pr
#     + (max_fix_rounds + 1) * review + max_fix_rounds * fix
#   = 2 + 4 + 3 + 12 + 1 + 3*3 + 2*4 = 39.0 USD, at most the fleet-fixture
#   [agents.chain] per_task_usd of 40.0.
# ESTIMATE (unverified): these budgets and the 40.0 ceiling are not measured; revisit
# after the acceptance run measures chain spend on the box.
max_concurrent_runs = 1
max_fix_rounds = 2

[stages.confirm]
budget_usd = 2.0

[stages.plan]
budget_usd = 4.0

[stages.audit]
budget_usd = 3.0

[stages.implement]
budget_usd = 12.0

[stages.pr]
budget_usd = 1.0

[stages.review]
budget_usd = 3.0

[stages.fix]
budget_usd = 4.0
