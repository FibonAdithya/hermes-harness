[project]
name = "hermes-friends"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
friends = "hermes_friends.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_friends"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
