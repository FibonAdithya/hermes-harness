[project]
name = "hermes-wiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hermes-wiki = "hermes_wiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_wiki"]
include = ["hermes_wiki/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
